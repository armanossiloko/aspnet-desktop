# Categories for GitHub's automatically generated release notes.
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Platform adapters
      labels: [windows, macos, linux]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
