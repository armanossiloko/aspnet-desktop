name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Packages always go to GitHub Packages. nuget.org and npmjs.com are opt-in through the repository variables
# PUBLISH_NUGET_ORG and PUBLISH_NPMJS (see docs/releasing.md).
jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  package:
    name: Package
    needs: ci
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install macOS workload
        run: dotnet workload install macos

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pack NuGet packages
        shell: bash
        env:
          # Apps generated from the templates install aspnetdesktop-client from npmjs.com once it's published there.
          TEMPLATE_NPM_REGISTRY: ${{ vars.PUBLISH_NPMJS == 'true' && 'npmjs' || 'github' }}
        run: dotnet pack AspNetDesktop.slnx -c Release -o artifacts -p:SkipClientBuild=true -p:TemplateNpmRegistry="$TEMPLATE_NPM_REGISTRY"

      - name: Check NuGet package versions match the tag
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          test ${#packages[@]} -eq 6
          for package in "${packages[@]}"; do
            [[ "$package" == *".${{ steps.version.outputs.version }}.nupkg" ]] || { echo "::error::$package does not match ${{ steps.version.outputs.version }}"; exit 1; }
          done

      - name: Pack npm packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Not `npm version`: it reinstalls the workspaces, and the samples' ^0.1.0 range doesn't match
          # prereleases or later minors, so npm would try to fetch the client from the registry.
          npm pkg set version="$VERSION" -w src/client
          npm pack -w src/client --pack-destination artifacts
          # GitHub Packages only hosts scoped npm packages.
          npm pkg set name="@$OWNER/aspnetdesktop-client" -w src/client
          npm pack -w src/client --pack-destination artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: artifacts/
          if-no-files-found: error

  publish-github:
    name: Publish to GitHub Packages
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # GitHub Packages doesn't host symbol packages; the .snupkg files are attached to the GitHub Release instead.
      - name: Push NuGet packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: dotnet nuget push "artifacts/*.nupkg" --source "$SOURCE" --api-key "$GITHUB_TOKEN" --skip-duplicate --no-symbols

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ needs.package.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish artifacts/${{ github.repository_owner }}-aspnetdesktop-client-*.tgz --tag "$DIST_TAG"

  publish-nuget:
    name: Publish to nuget.org
    needs: package
    if: vars.PUBLISH_NUGET_ORG == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Configure NuGet trusted publishing (vars.NUGET_USER) or the NUGET_API_KEY secret. See docs/releasing.md."
            exit 1
          fi
          # Symbol packages (.snupkg) next to each .nupkg are pushed automatically.
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-npm:
    name: Publish to npmjs.com
    needs: package
    if: vars.PUBLISH_NPMJS == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.package.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish artifacts/aspnetdesktop-client-*.tgz --access public --provenance --tag "$DIST_TAG"

  github-release:
    name: GitHub Release
    needs: [package, publish-github, publish-nuget, publish-npm]
    # The public registries are optional: skipped jobs don't block the release, failed ones do.
    if: ${{ !cancelled() && needs.publish-github.result == 'success' && needs.publish-nuget.result != 'failure' && needs.publish-npm.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.package.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          NUGET_ORG: ${{ needs.publish-nuget.result == 'success' }}
          NPMJS: ${{ needs.publish-npm.result == 'success' }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See [CHANGELOG.md](CHANGELOG.md)." > release-notes.md; fi
          {
            echo
            echo "## Packages"
            echo
            echo "- GitHub Packages: [NuGet and npm](https://github.com/$OWNER?tab=packages&repo_name=$REPOSITORY) ([setup](https://github.com/$OWNER/$REPOSITORY#install))"
            if [ "$NUGET_ORG" = true ]; then
              echo "- nuget.org: [AspNetDesktop $VERSION](https://www.nuget.org/packages/AspNetDesktop/$VERSION), [AspNetDesktop.Templates $VERSION](https://www.nuget.org/packages/AspNetDesktop.Templates/$VERSION)"
            fi
            if [ "$NPMJS" = true ]; then
              echo "- npm: [aspnetdesktop-client@$VERSION](https://www.npmjs.com/package/aspnetdesktop-client/v/$VERSION)"
            fi
          } >> release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.package.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.package.outputs.prerelease == 'true' }}
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/*.tgz
