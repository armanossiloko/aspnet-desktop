name: Release

# release-please keeps a release PR open per component (the NuGet packages, the npm client) with the next
# version and changelog, worked out from Conventional Commits. Merging a release PR tags it, creates the GitHub
# Release, and the jobs below publish that component's packages only. See docs/releasing.md.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an existing release again from its tag, e.g. after a publish job failed.
        type: choice
        options: [none, AspNetDesktop, aspnetdesktop-client]
        default: none

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      nuget: ${{ steps.publish.outputs.nuget }}
      nuget-version: ${{ steps.publish.outputs.nuget-version }}
      nuget-tag: ${{ steps.publish.outputs.nuget-tag }}
      client: ${{ steps.publish.outputs.client }}
      client-version: ${{ steps.publish.outputs.client-version }}
      client-tag: ${{ steps.publish.outputs.client-tag }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # GITHUB_TOKEN-made release PRs only get CI runs after a maintainer approves them; a PAT avoids that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Collect the releases to publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPUBLISH: ${{ inputs.publish }}
          NUGET: ${{ steps.release.outputs.release_created }}
          NUGET_VERSION: ${{ steps.release.outputs.version }}
          NUGET_TAG: ${{ steps.release.outputs.tag_name }}
          CLIENT: ${{ steps.release.outputs['src/client--release_created'] }}
          CLIENT_VERSION: ${{ steps.release.outputs['src/client--version'] }}
          CLIENT_TAG: ${{ steps.release.outputs['src/client--tag_name'] }}
        run: |
          # A manual run can publish a component's latest release again (the version is in the manifest).
          if [ "$REPUBLISH" = AspNetDesktop ] || [ "$REPUBLISH" = aspnetdesktop-client ]; then
            path=$([ "$REPUBLISH" = AspNetDesktop ] && echo . || echo src/client)
            version=$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$GITHUB_SHA" --jq .content \
              | base64 -d | jq -r --arg path "$path" '.[$path] // empty')
            [ -n "$version" ] || { echo "::error::$REPUBLISH has not been released yet."; exit 1; }
            tag="$REPUBLISH-v$version"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
            echo "Publishing $tag again."
            if [ "$REPUBLISH" = AspNetDesktop ]; then
              NUGET=true NUGET_VERSION=$version NUGET_TAG=$tag
            else
              CLIENT=true CLIENT_VERSION=$version CLIENT_TAG=$tag
            fi
          fi

          {
            echo "nuget=${NUGET:-false}"
            echo "nuget-version=$NUGET_VERSION"
            echo "nuget-tag=$NUGET_TAG"
            echo "client=${CLIENT:-false}"
            echo "client-version=$CLIENT_VERSION"
            echo "client-tag=$CLIENT_TAG"
          } >> "$GITHUB_OUTPUT"

  # CI doesn't run for release PRs (ci.yml ignores release-please's files), so report its required check here and they
  # can be merged without bypassing the ruleset. The full CI runs below, before anything is published.
  release-prs:
    name: Report CI on release PRs
    needs: release-please
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Report CI result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same list as in ci.yml: release-please's version and changelog changes.
          release_files='CHANGELOG\.md|src/client/CHANGELOG\.md|\.release-please-manifest\.json|src/client/package\.json|package-lock\.json'
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions --limit 20 \
            --json number,headRefName,headRefOid,files \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | [.number, .headRefOid, ([.files[].path] | join(" "))] | @tsv' |
          while IFS=$'\t' read -r number sha files; do
            if tr ' ' '\n' <<< "$files" | grep -v -x -E "$release_files" | grep -q .; then
              echo "#$number changes more than versions and changelogs, so CI checks it."
              continue
            fi
            gh api "repos/$GITHUB_REPOSITORY/check-runs" --silent \
              -f name='CI result' -f head_sha="$sha" -f status=completed -f conclusion=success \
              -f 'output[title]=Release PR: nothing to build' \
              -f 'output[summary]=This pull request only changes versions and changelogs. The Release workflow runs the full CI before it publishes the release.'
            echo "#$number: reported CI result on $sha."
          done

  ci:
    name: CI
    needs: release-please
    if: needs.release-please.outputs.nuget == 'true' || needs.release-please.outputs.client == 'true'
    # Covers what ci.yml's jobs declare, including CodeQL's, although CodeQL doesn't run here.
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  pack-nuget:
    name: Pack NuGet packages
    needs: [release-please, ci]
    if: needs.release-please.outputs.nuget == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.nuget-tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install macOS workload
        run: dotnet workload install macos

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pack
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.nuget-version }}
          # Apps generated from the templates install aspnetdesktop-client from npmjs.com once it's published there.
          TEMPLATE_NPM_REGISTRY: ${{ vars.PUBLISH_NPMJS == 'true' && 'npmjs' || 'github' }}
        run: >-
          dotnet pack AspNetDesktop.slnx -c Release -o artifacts -p:SkipClientBuild=true
          -p:MinVerVersionOverride="$VERSION" -p:TemplateNpmRegistry="$TEMPLATE_NPM_REGISTRY"

      - name: Check the packages
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.nuget-version }}
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          test ${#packages[@]} -eq 6
          for package in "${packages[@]}"; do
            [[ "$package" == *".$VERSION.nupkg" ]] || { echo "::error::$package does not match $VERSION"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/
          if-no-files-found: error

  pack-npm:
    name: Pack npm package
    needs: [release-please, ci]
    if: needs.release-please.outputs.client == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.client-tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The version is already in src/client/package.json: the release PR bumped it.
      - name: Pack
        env:
          VERSION: ${{ needs.release-please.outputs.client-version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          test "$(node -p "require('./src/client/package.json').version")" = "$VERSION"
          # npm pack doesn't create the destination folder.
          mkdir -p artifacts
          npm pack -w src/client --pack-destination artifacts
          # GitHub Packages only hosts scoped npm packages.
          npm pkg set name="@$OWNER/aspnetdesktop-client" -w src/client
          npm pack -w src/client --pack-destination artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: artifacts/
          if-no-files-found: error

  nuget-github:
    name: Publish NuGet packages to GitHub Packages
    needs: [release-please, pack-nuget]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the packages to the release
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # GitHub Packages doesn't host symbol packages; the .snupkg files go on the GitHub Release instead.
      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: dotnet nuget push "artifacts/*.nupkg" --source "$SOURCE" --api-key "$GITHUB_TOKEN" --skip-duplicate --no-symbols

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.nuget-tag }}
        run: gh release upload "$TAG" artifacts/*.nupkg artifacts/*.snupkg --clobber --repo "$GITHUB_REPOSITORY"

  npm-github:
    name: Publish npm package to GitHub Packages
    needs: [release-please, pack-npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the package to the release
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: artifacts

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      # Without the ./, npm reads artifacts/<file>.tgz as a GitHub user/repo and tries to clone it.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ contains(needs.release-please.outputs.client-version, '-') && 'next' || 'latest' }}
        run: npm publish ./artifacts/${{ github.repository_owner }}-aspnetdesktop-client-*.tgz --tag "$DIST_TAG"

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.client-tag }}
        run: gh release upload "$TAG" artifacts/*.tgz --clobber --repo "$GITHUB_REPOSITORY"

  nuget-org:
    name: Publish to nuget.org
    needs: [release-please, pack-nuget]
    if: vars.PUBLISH_NUGET_ORG == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Configure NuGet trusted publishing (vars.NUGET_USER) or the NUGET_API_KEY secret. See docs/releasing.md."
            exit 1
          fi
          # Symbol packages (.snupkg) next to each .nupkg are pushed automatically.
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  npmjs:
    name: Publish to npmjs.com
    needs: [release-please, pack-npm]
    if: vars.PUBLISH_NPMJS == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: artifacts

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ contains(needs.release-please.outputs.client-version, '-') && 'next' || 'latest' }}
        run: npm publish ./artifacts/aspnetdesktop-client-*.tgz --access public --provenance --tag "$DIST_TAG"
