name: Commits

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commits-${{ github.ref }}
  # Pull requests only: on master, a cancelled run would leave that push's commits unchecked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Conventional commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Squash merges use the pull request title as the commit message.
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint --verbose

      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE" --to "$HEAD" --verbose

      - name: Check pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            npx commitlint --from "$BEFORE" --to HEAD --verbose
          else
            # New branch or rewritten history: check every commit, including the root.
            root="$(git rev-list --max-parents=0 HEAD)"
            git log -1 --format=%B "$root" | npx commitlint --verbose
            npx commitlint --from "$root" --to HEAD --verbose
          fi
