name: CI

# The only workflow that runs for pull requests and pushes to master. The changes job works out which jobs a change
# needs (.github/scripts/affected-jobs.sh) and the others are skipped. "CI result" is the one required check.
on:
  push:
    branches: [master]
    # Release-please's own files: release PRs and their merges are checked by the Release workflow instead.
    paths-ignore:
      - CHANGELOG.md
      - '**/CHANGELOG.md'
      - .release-please-manifest.json
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - '**/CHANGELOG.md'
      - .release-please-manifest.json
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every build and test job (CodeQL and the commit check are skipped).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      commits: ${{ steps.affected.outputs.commits }}
      client: ${{ steps.affected.outputs.client }}
      build: ${{ steps.affected.outputs.build }}
      smoke: ${{ steps.affected.outputs.smoke }}
      pack: ${{ steps.affected.outputs.pack }}
      codeql: ${{ steps.affected.outputs.codeql }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Work out the affected jobs
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
          PR: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE: ${{ github.event.before }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          all_languages='codeql=["actions","csharp","javascript-typescript"]'
          every_job() { printf '%s\n' client=true build=true smoke=true pack=true; }

          if [ "$FULL" = true ]; then
            # Called by the Release workflow before it publishes.
            { echo commits=false; every_job; echo 'codeql=[]'; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          complete=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
              # The API lists at most 3000 files.
              [ "$PR_FILES" -gt 3000 ] || complete=true
              [ "$PR_AUTHOR" = 'github-actions[bot]' ] && [[ "$HEAD_REF" == release-please--* ]] && release=true || release=false
              ;;
            push)
              if [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
                compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA"); then
                files=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$compare")
                # The API lists at most 300 files.
                complete=$(jq '.files | length < 300' <<< "$compare")
              fi
              [[ "$HEAD_MESSAGE" == "chore(master): release "* ]] && release=true || release=false
              ;;
            *)
              # Manual runs check everything.
              { echo commits=false; every_job; echo "$all_languages"; } >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ "$complete" != true ]; then
            echo "Couldn't list every changed file; running everything."
            { echo commits=true; every_job; echo "$all_languages"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Changed files:\n%s\n' "$files"

          # Release PRs (and their merges) only bump versions and changelogs, and the Release workflow runs the full
          # CI before it publishes. Anything else pushed to a release PR is checked like any other change.
          release_files='CHANGELOG\.md|src/client/CHANGELOG\.md|\.release-please-manifest\.json|src/client/package\.json|package-lock\.json'
          if [ "$release" = true ] && ! grep -v -x -E "$release_files" <<< "$files" | grep -q .; then
            echo "Only release-please's version and changelog changes: nothing to run."
            printf '%s\n' commits=false client=false build=false smoke=false pack=false 'codeql=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          affected=$(bash .github/scripts/affected-jobs.sh <<< "$files")
          echo "$affected"
          { echo commits=true; echo "$affected"; } >> "$GITHUB_OUTPUT"

  commits:
    name: Conventional commits
    needs: changes
    if: needs.changes.outputs.commits == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Squash merges use the pull request title as the commit message. The title comes from the API rather than the
      # event, so re-running this job after renaming the pull request checks the new title.
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title | npx commitlint --verbose

      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE" --to "$HEAD" --verbose

      - name: Check pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            npx commitlint --from "$BEFORE" --to HEAD --verbose
          else
            # New branch or rewritten history: check every commit, including the root.
            root="$(git rev-list --max-parents=0 HEAD)"
            git log -1 --format=%B "$root" | npx commitlint --verbose
            npx commitlint --from "$root" --to HEAD --verbose
          fi

  client:
    name: JS client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:client
      - run: npm run typecheck -w aspnetdesktop-client
      - run: npm run test:client

      - name: Build sample frontends
        run: npm run build -w angular-app-client -w react-app-client -w vue-app-client

      - name: Check package contents
        run: npm pack -w aspnetdesktop-client --dry-run

  build:
    name: Build & test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
          # The macOS workload needs the Xcode version it was built against (27.1), which ships on this image.
          - name: macOS
            os: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install macOS workload
        if: runner.os != 'Linux'
        run: dotnet workload install macos

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: '27.1'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Release builds also run the samples' MSBuild targets that build the frontends into wwwroot.
      - name: Build
        run: dotnet build AspNetDesktop.slnx -c Release

      - name: Test
        run: dotnet test --solution AspNetDesktop.slnx -c Release --no-build

  smoke:
    name: WebView smoke test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            run: tests/AspNetDesktop.SmokeTests/bin/Release/net10.0-windows/AspNetDesktop.SmokeTests.exe
          - name: Linux
            os: ubuntu-24.04
            run: xvfb-run -a dotnet tests/AspNetDesktop.SmokeTests/bin/Release/net10.0/AspNetDesktop.SmokeTests.dll
          # Run the executable inside the final (universal) .app bundle: `dotnet run` would hand the bundle to `open`
          # and not wait, and the per-RID bundles under osx-*/ are incomplete intermediates.
          - name: macOS
            os: xcode-27
            run: "\"$(find tests/AspNetDesktop.SmokeTests/bin/Release/net10.0-macos -maxdepth 1 -name '*.app' | head -n 1)/Contents/MacOS/AspNetDesktop.SmokeTests\""
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install macOS workload
        if: runner.os == 'macOS'
        run: dotnet workload install macos

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: '27.1'

      - name: Install GTK 4 and WebKitGTK 6
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1 libwebkitgtk-6.0-4 xvfb xauth
          # WebKit's bubblewrap sandbox needs unprivileged user namespaces, which Ubuntu 24.04 restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:client

      - name: Build smoke test
        run: dotnet build tests/AspNetDesktop.SmokeTests -c Release

      - name: Run smoke test
        shell: bash
        run: |
          set -o pipefail
          ${{ matrix.run }} 2>&1 | tee smoke.log
          # Guard against launchers that return early: the app prints this line only after the WebView reported back.
          grep -q "checks passed" smoke.log
        env:
          # Software rendering for headless runners without a GPU.
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
          # No accessibility bus on headless runners.
          GTK_A11Y: none

      - name: Show the app bundle layout
        if: failure() && runner.os == 'macOS'
        run: find tests/AspNetDesktop.SmokeTests/bin/Release -path '*.app/*' -not -name '*.dll' -not -name '*.dylib' | head -n 100

  pack:
    name: Pack & template check
    needs: changes
    if: needs.changes.outputs.pack == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The AspNetDesktop metapackage includes the net10.0-macos target.
      - name: Install macOS workload
        run: dotnet workload install macos

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pack NuGet packages
        run: dotnet pack AspNetDesktop.slnx -c Release -o artifacts -p:SkipClientBuild=true

      - name: Pack npm package
        run: npm pack -w aspnetdesktop-client --pack-destination artifacts

      - name: Instantiate and build the templates
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$(pwd -W)/artifacts"
          work="$RUNNER_TEMP/template-check"
          hive="$RUNNER_TEMP/template-hive"
          mkdir -p "$work"
          dotnet new install "$(ls "$artifacts"/AspNetDesktop.Templates.*.nupkg)" --debug:custom-hive "$hive"
          cat > "$work/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          for template in angular react vue; do
            dotnet new "aspnetdesktop-$template" -o "$work/My${template^}App" --debug:custom-hive "$hive"
            dotnet build "$work/My${template^}App" --packages "$work/packages"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error

  codeql:
    name: CodeQL
    needs: changes
    if: needs.changes.outputs.codeql != '[]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      languages: ${{ needs.changes.outputs.codeql }}

  # The required check. It passes when every job passed or was skipped (not affected by the change), and fails if any
  # job failed or was cancelled.
  result:
    name: CI result
    needs: [changes, commits, client, build, smoke, pack, codeql]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check the job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
