name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  client:
    name: JS client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:client
      - run: npm run typecheck -w aspnetdesktop-client
      - run: npm run test:client

      - name: Build sample frontends
        run: npm run build -w angular-app-client -w react-app-client

      - name: Check package contents
        run: npm pack -w aspnetdesktop-client --dry-run

  build:
    name: Build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
          # The macOS workload needs the Xcode version it was built against (27.1), which ships on this image.
          - name: macOS
            os: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install macOS workload
        if: runner.os != 'Linux'
        run: dotnet workload install macos

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: '27.1'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Release builds also run the samples' MSBuild targets that build the frontends into wwwroot.
      - name: Build
        run: dotnet build AspNetDesktop.slnx -c Release

      - name: Test
        run: dotnet test --solution AspNetDesktop.slnx -c Release --no-build

  smoke:
    name: WebView smoke test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            run: tests/AspNetDesktop.SmokeTests/bin/Release/net10.0-windows/AspNetDesktop.SmokeTests.exe
          - name: Linux
            os: ubuntu-24.04
            run: xvfb-run -a dotnet tests/AspNetDesktop.SmokeTests/bin/Release/net10.0/AspNetDesktop.SmokeTests.dll
          # Run the executable inside the .app bundle: `dotnet run` would hand the bundle to `open` and not wait.
          - name: macOS
            os: xcode-27
            run: "\"$(find tests/AspNetDesktop.SmokeTests/bin/Release -path '*.app/Contents/MacOS/AspNetDesktop.SmokeTests' -type f | head -n 1)\""
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install macOS workload
        if: runner.os == 'macOS'
        run: dotnet workload install macos

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: '27.1'

      - name: Install GTK 4 and WebKitGTK 6
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1 libwebkitgtk-6.0-4 xvfb xauth
          # WebKit's bubblewrap sandbox needs unprivileged user namespaces, which Ubuntu 24.04 restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:client

      - name: Build smoke test
        run: dotnet build tests/AspNetDesktop.SmokeTests -c Release

      - name: Run smoke test
        shell: bash
        run: |
          set -o pipefail
          ${{ matrix.run }} 2>&1 | tee smoke.log
          # Guard against launchers that return early: the app prints this line only after the WebView reported back.
          grep -q "checks passed" smoke.log
        env:
          # Software rendering for headless runners without a GPU.
          LIBGL_ALWAYS_SOFTWARE: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
          # No accessibility bus on headless runners.
          GTK_A11Y: none

      - name: Show the app bundle layout
        if: failure() && runner.os == 'macOS'
        run: find tests/AspNetDesktop.SmokeTests/bin/Release -path '*.app/*' -not -name '*.dll' -not -name '*.dylib' | head -n 100

  pack:
    name: Pack & template check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The AspNetDesktop metapackage includes the net10.0-macos target.
      - name: Install macOS workload
        run: dotnet workload install macos

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pack NuGet packages
        run: dotnet pack AspNetDesktop.slnx -c Release -o artifacts -p:SkipClientBuild=true

      - name: Pack npm package
        run: npm pack -w aspnetdesktop-client --pack-destination artifacts

      - name: Instantiate and build the templates
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$(pwd -W)/artifacts"
          work="$RUNNER_TEMP/template-check"
          hive="$RUNNER_TEMP/template-hive"
          mkdir -p "$work"
          dotnet new install "$(ls "$artifacts"/AspNetDesktop.Templates.*.nupkg)" --debug:custom-hive "$hive"
          cat > "$work/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          for template in angular react; do
            dotnet new "aspnetdesktop-$template" -o "$work/My${template^}App" --debug:custom-hive "$hive"
            dotnet build "$work/My${template^}App" --packages "$work/packages"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error
