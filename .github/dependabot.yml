# Commit messages follow Conventional Commits: build(deps): / build(deps-dev): / ci(deps):
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, .NET]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'typescript', 'rxjs', 'tslib']
      react-vite:
        patterns: ['react', 'react-dom', '@types/react*', 'vite', '@vitejs/*']
      tooling:
        patterns: ['vitest']
    ignore:
      # Angular pins a narrow TypeScript range; TypeScript moves when Angular does.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, javascript]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, github-actions]
